<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZRels - TREC Qrels Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @keyframes pixelGradient {
      0% {
        background-position: 0% 0%;
      }
      100% {
        background-position: 200% 200%;
      }
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(
        135deg,
        #13181C 0%,
        #1A2228 25%,
        #13181C 50%,
        #0D1114 75%,
        #13181C 100%
      );
      background-size: 400% 400%;
      animation: pixelGradient 8s steps(60) infinite;
      color: white;
      overflow: hidden;
      height: 100vh;
    }

    /* File Select Screen Styles */
    #file-select-screen {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 0 100px;
      position: relative;
      overflow: hidden;
    }

    .left-section {
      display: flex;
      flex-direction: column;
      gap: 60px;
      z-index: 10;
    }

    .title-svg {
      width: 648px;
      height: 386px;
    }

    .button-container {
      display: flex;
      justify-content: center;
    }

    .button-svg {
      width: 550px;
      height: 150px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .button-svg:hover path[fill="white"],
    .button-svg:hover rect[fill="white"] {
      fill: #959595;
    }

    .button-svg:hover {
      transform: translateY(-2px);
    }

    .button-svg:active {
      transform: translateY(0);
    }

    .right-section {
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .folder-svg {
      width: 600px;
      height: 800px;
    }

    #file-status {
      margin-top: 30px !important;
      color: #5A7A60;
      font-size: 16px;
      text-align: center;
    }

    /* App Screen Styles */
    #app-screen {
      display: none;
      padding: 20px;
      min-height: 100vh;
    }

    #app-screen h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 36px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    #topic-info {
      background: #5A7A60;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    #topic-info h2 {
      margin-bottom: 15px;
      color: white;
      font-weight: 500;
    }

    #topic-info p {
      margin: 10px 0;
      color: white;
      line-height: 1.6;
    }

    #document-viewer {
      background: #5A7A60;
      padding: 25px;
      border-radius: 12px;
      min-height: 400px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    #document-viewer h3 {
      color: white;
      margin-bottom: 15px;
      font-weight: 500;
    }

    #document-content {
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-height: 400px;
      overflow-y: auto;
      padding: 15px;
      background: rgba(19, 24, 28, 0.3);
      border-radius: 8px;
      color: white;
    }

    #controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      padding: 25px;
      background: #5A7A60;
      border-radius: 12px;
      flex-wrap: wrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .nav-buttons button {
      padding: 12px 24px;
      margin: 0 5px;
      cursor: pointer;
      background: #13181C;
      color: white;
      border: 2px solid white;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .nav-buttons button:hover {
      background: white;
      color: #13181C;
      transform: translateY(-2px);
    }

    .nav-buttons button:disabled {
      background: #666;
      border-color: #666;
      color: #999;
      cursor: not-allowed;
      transform: none;
    }

    .relevance-control {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 0 15px;
    }

    .relevance-control label {
      font-weight: 600;
      font-size: 16px;
      color: white;
    }

    .relevance-control input[type="checkbox"] {
      width: 35px;
      height: 35px;
      cursor: pointer;
      accent-color: #13181C;
    }

    #load-qrels-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #5A7A60;
      color: white;
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    #load-qrels-btn:hover {
      background: #4A6A50;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    .warning {
      color: #FFB84D;
    }

    #produce-qrels-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #5A7A60;
      color: white;
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    #produce-qrels-btn:hover {
      background: #4A6A50;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    #status {
      text-align: center;
      padding: 15px;
      margin-top: 10px;
      font-weight: 600;
      border-radius: 8px;
      background: rgba(90, 122, 96, 0.2);
    }

    .success {
      color: #5A7A60;
    }

    .error {
      color: #FF6B6B;
    }

    .counter {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(19, 24, 28, 0.3);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>

      </div>

        <button id="next-doc-btn">Next Document</button>
      </div>
    </div>

      <h3>Document <span id="current-doc-num"></span> of <span id="total-docs"></span> (DocNo: <span id="doc-number"></span>)</h3>

    </div>
