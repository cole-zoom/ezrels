<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZRels - TREC Qrels Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    #file-select-screen {
      text-align: center;
      padding: 100px 20px;
    }

    #file-select-screen button {
      padding: 15px 30px;
      font-size: 16px;
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }

    #file-select-screen button:hover {
      background: #0056b3;
    }

    #app-screen {
      display: none;
    }

    #topic-info {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 4px;
      border: 1px solid #ddd;
    }

    #topic-info h2 {
      margin-bottom: 10px;
    }

    #topic-info p {
      margin: 5px 0;
    }

    #document-viewer {
      background: white;
      padding: 20px;
      border-radius: 4px;
      border: 1px solid #ddd;
      min-height: 400px;
      margin-bottom: 20px;
    }

    #document-content {
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
      padding: 10px;
      background: #fafafa;
      border: 1px solid #eee;
    }

    #controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      padding: 20px;
      background: white;
      border-radius: 4px;
      border: 1px solid #ddd;
    }

    .nav-buttons button {
      padding: 12px 24px;
      margin: 0 5px;
      cursor: pointer;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }

    .nav-buttons button:hover {
      background: #218838;
    }

    .nav-buttons button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .relevance-control {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 0 15px;
    }

    .relevance-control label {
      font-weight: bold;
      font-size: 16px;
    }

    .relevance-control input[type="checkbox"] {
      width: 35px;
      height: 35px;
      cursor: pointer;
    }

    #load-qrels-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    #load-qrels-btn:hover {
      background: #0056b3;
    }

    .warning {
      color: orange;
    }

    #produce-qrels-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    #produce-qrels-btn:hover {
      background: #c82333;
    }

    #status {
      text-align: center;
      padding: 10px;
      margin-top: 10px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .counter {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="file-select-screen">
    <h1>EZRels - TREC Qrels Generator</h1>
    <p style="margin: 20px 0;">Please select a topics file to begin</p>
    <button id="select-file-btn">Select Topics File</button>
    <p id="file-status" style="margin-top: 20px;"></p>
  </div>

  <div id="app-screen">
    <h1>EZRels - TREC Qrels Generator</h1>
    
    <div id="topic-info">
      <h2>Topic <span id="topic-number"></span>: <span id="topic-title"></span></h2>
      <p><strong>Description:</strong> <span id="topic-desc"></span></p>
      <p><strong>Narrative:</strong> <span id="topic-narrative"></span></p>
      <p class="counter">Topic <span id="current-topic-num"></span> of <span id="total-topics"></span></p>
    </div>

    <div id="controls">
      <div class="nav-buttons">
        <button id="prev-topic-btn">Previous Topic</button>
        <button id="next-topic-btn">Next Topic</button>
      </div>

      <div class="nav-buttons">
        <button id="prev-doc-btn">Previous Document</button>
      </div>

      <div class="relevance-control">
        <label for="relevant-checkbox">Relevant:</label>
        <input type="checkbox" id="relevant-checkbox">
      </div>

      <div class="nav-buttons">
        <button id="next-doc-btn">Next Document</button>
      </div>
    </div>

    <div id="document-viewer">
      <h3>Document <span id="current-doc-num"></span> of <span id="total-docs"></span> (DocNo: <span id="doc-number"></span>)</h3>
      <div id="document-content"></div>
    </div>

    <button id="load-qrels-btn">Load Existing Qrels</button>
    <button id="produce-qrels-btn">Produce Qrels</button>

    <div id="status"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
